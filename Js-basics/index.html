<!doctype html>
<html>
    <head>
        <title> Basic Webpage </title>
        <style>
            .buy{
                background-color: orange;
                border: none;
                cursor: pointer;
                transition: transform 0.1s ease;
                /* 0.15 opacity creates a smooth, natural black shadow */
                box-shadow: 2px 4px 7px 0px rgba(0, 0, 0, 0.15);

            }
            .cart{
                background-color: yellow;
                border: none;
                cursor: pointer;
                transition: transform 0.1s ease;
                /* 0.15 opacity creates a smooth, natural black shadow */
                box-shadow: 2px 4px 7px 0px rgba(0, 0, 0, 0.15);
            }
            .cart,.buy:active{
                transform: translateY(2px);
            }

            .buy:active {

            }

        </style>
    </head>
    <body>
        <p>Adults Plain Cotton T-shirt</p>
        <p>Price $7.99</p>
        <button class="cart" onclick="alert('Added');">Add to cart</button>
        <button class="buy" onclick=" alert('Purchased'); console.log('Loading'); ">Buy now</button>
    </body>
    <script>

    </script>

</html>
