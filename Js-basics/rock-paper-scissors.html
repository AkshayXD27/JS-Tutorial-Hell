<!DOCTYPE html>
<html>
    <head>
        <title>Rock paper scissors</title>
    </head>
    <body>
        <p> Rock Paper Scissors </p>
        <button onclick="
            calcResult('Rock',pickComputerMove());
          "> Rock </button>
        <button onclick="
              calcResult('Paper',pickComputerMove());
            "> Paper </button>
        <button onclick="
            calcResult('Scissors',pickComputerMove());
            "> Scissors </button>
        <div id="content"></div>
    </body>
    <script>
        const scores = {
          win: 0,
          losses: 0,
          tie:0
        };

        function pickComputerMove() {
          let randomNumber = Math.random();
          let computerMove = '';
          if (randomNumber < 1/3){
            computerMove = 'Rock';
          }
          else if (randomNumber < 2/3){
              computerMove = 'Paper';
          }
          else{
            computerMove = 'Scissors';
          }
          return computerMove;
        }

        function calcResult(userInp,computerMove) {
          if (computerMove == 'Rock' && userInp == 'Rock'){
            alert(`You Chose ${userInp} and Computer Picked ${computerMove}, Tie! `)
            scores.tie += 1;
          }
          else if (computerMove == 'Paper' && userInp == 'Paper'){
            alert(`You Chose ${userInp} and Computer Picked ${computerMove}, Tie! `)
            scores.tie += 1;
          }
          else if (computerMove == 'Scissors' && userInp == 'Scissors'){
            alert(`You Chose ${userInp} and Computer Picked ${computerMove}, Tie! `)
            scores.tie += 1;
          }
          else if (computerMove == 'Scissors' && userInp == 'Rock'){
            alert(`You Chose ${userInp} and Computer Picked ${computerMove}, You Won! `)
            scores.win += 1;
          }
          else if (computerMove == 'Scissors' && userInp == 'Paper'){
            alert(`You Chose ${userInp} and Computer Picked ${computerMove}, You Lost! `)
            scores.losses += 1;
          }
          else if (computerMove == 'Paper' && userInp == 'Rock'){
            alert(`You Chose ${userInp} and Computer Picked ${computerMove}, You Lost! `)
            scores.losses += 1;
          }
          else if (computerMove == 'Paper' && userInp == 'Scissors'){
            alert(`You Chose ${userInp} and Computer Picked ${computerMove}, You Won! `)
            scores.win += 1;
          }
          else if (computerMove == 'Rock' && userInp == 'Scissors'){
            alert(`You Chose ${userInp} and Computer Picked ${computerMove}, You Lost! `)
            scores.losses += 1;
          }
          else if (computerMove == 'Rock' && userInp == 'Paper'){
            alert(`You Chose ${userInp} and Computer Picked ${computerMove}, You Won!`)
            scores.win += 1;
          }
          const ele = document.getElementById("content");
          ele.innerHTML =   `<p>Wins = ${scores.win} Losses = ${scores.losses} Ties = ${scores.tie} </p> `
        }

    </script>
</html>
