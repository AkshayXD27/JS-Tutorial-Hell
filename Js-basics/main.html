<!DOCTYPE html>
<html>
    <head>
        <title>Main Page </title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <style>
            *{
                font-family: 'Valley Sans';
            }
            #totalCost {
                margin-top: 20px;
                margin-bottom: 40px;
            }
        </style>
    </head>
    <body>
        <p> Youtube Subscribe Button </p>
        <button onclick="Subscribing()">
            Subscribe
        </button>

        <p> Rock Paper Scissors </p>
        <a href="rock-paper-scissors.html">Click Here</a>

        <p>Amazon Shipping Calculator</p>
        <p>Orders under $40 = +$10 shipping.</p>
        <p>Orders over $40 = FREE shipping.</p>

            <input class="costs" type="number" placeholder="Cost Of Order">
            <button onclick="calculateCost()">Calculate</button>

        <div id="totalCost">

        </div>

        <a href="maincss.html">Css version of projects</a>

        <script>
        let subStatus = localStorage.getItem('subStatus') || 'Subscribe';

        if(subStatus == "Subscribed"){
          document.querySelector('button').innerHTML = "Subscribed";
        }
          function Subscribing(){
            if (subStatus == 'Subscribe') {
            document.querySelector('button').innerHTML = 'Subscribed';
            subStatus = 'Subscribed';
            localStorage.setItem('subStatus',subStatus);}
            else {
              document.querySelector('button').innerHTML = 'Subscribe';
              subStatus = 'Subscribe';
              localStorage.setItem('subStatus',subStatus);}
            }
            function calculateCost(){
              placeHolder = document.getElementById('totalCost');

              console.log('function ran')
              let cost = document.querySelector('.costs').value;
              cost = parseFloat(cost);
              if(cost < 40){
                cost += 10;
                totalCost.innerHTML = `Total cost = $${cost}`;
              }
              else{
                totalCost.innerHTML =  `Total cost =  $${cost}`;
              }
            }

        </script>
    </body>
</html>
