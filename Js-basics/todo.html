<!DOCTYPE html>
<html>
    <head> <title> To-Do-List </title>
        <style>
            .tasks {
                display: grid;
                grid-template-columns: 150px auto;
                margin:10px 0;
            }
            #add{
                background-color: cyan;
                border: none;
                margin-left: 10px;
                padding: 7px 15px;
                border-radius: 12px;
                text-align: center;
                color: black;
                cursor: pointer;
                transition: 0.1s;
            }
            button:active {
                transform: translateY(2px);
            }
            #delete {
                background-color: red;
                border: none;
                margin-left: 10px;
                padding: 7px 15px;
                border-radius: 12px;
                color: white;
                cursor: pointer;
                transition: 0.1s;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <p> To-Do-List </p>
        <input placeholder="Add a task" class="userTask" type="text">
        <input type="date" class="time">
        <button id="add" onclick="taskAdd()">Add</button>
        <div class="tasks"></div>
        <script src="todo.js"></script>
    </body>
</html>
